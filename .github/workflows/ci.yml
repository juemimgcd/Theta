name: CLI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the existing Ubuntu status check name.
          - os: ubuntu-latest
            name: check
          - os: macos-latest
            name: check (macOS)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify src/cli.ts is executable
        run: test -x src/cli.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run check
      - name: Run tests
        run: bun test
      - name: Run offline session example
        run: bun examples/session-flow.ts
      - name: Link the CLI
        run: |
          bun link
          bun pm bin -g >> "$GITHUB_PATH"
      - name: Start the linked CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: theta --help
