name: CLI checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun test
      - name: Start CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/src/cli.ts" --help'
