name: 文档问题
description: 指出 README、官网或示例中有误或缺失的说明。
labels: [documentation, "status: triage"]
body:
  - type: input
    id: location
    attributes:
      label: 页面或示例
      description: 填写链接、文件路径或章节名。缺少文档时，写下你原本会去哪里找。
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 哪一步需要改进？
      description: 引用有疑问的文字或命令，说明它让你卡在哪里。知道正确用法时，可以一并补充。
    validations:
      required: true
